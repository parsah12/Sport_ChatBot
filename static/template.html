<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <title>مربی هوشمند بدنسازی</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .msg img, .msg video { max-width: 300px; border-radius: 12px; margin: 8px 0; cursor: pointer; }
        .file-preview img, .file-preview video { max-height: 180px; border-radius: 12px; }
        .remove-preview { position: absolute; top: -8px; right: -8px; background: red; color: white; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 16px; }

        /* ⭐ NEW ـــ استایل تایپینگ */
        #typingIndicator {
            display: none;
            color: #555;
            font-size: 14px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>چت‌ها</h2>
            <button onclick="send({action:'new_chat'})" class="btn">چت جدید</button>
            <button onclick="if(confirm('همه پاک بشن؟')) send({action:'clear_all'})" class="btn danger">پاک کردن همه</button>
            <hr>
            <div id="chatList" class="chat-list"></div>
        </div>

        <div class="chat-area">
            <div id="chatTitle" class="chat-title">مربی ورزش هوشمند</div>

            <!-- ⭐ NEW ـــ نشانگر تایپینگ -->
            <div id="typingIndicator">🤖 در حال پردازش پیام شما...</div>

            <div id="messages" class="messages"></div>

            <div class="input-container">
                <div id="filePreview" class="file-preview"></div>
                <div class="input-box">
                    <label for="fileInput" class="attach-btn" title="آپلود عکس یا فیلم"><i class="fa-solid fa-paperclip"></i></label>
                    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
                    <textarea id="msgInput" placeholder="هدفت چیه؟ (چربی‌سوزی، عضله، فرم بدن...)" rows="1"></textarea>
                    <button id="sendBtn" class="send-btn">send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <span class="modal-close" onclick="closeModal()">×</span>
        <img id="modalImage" src="" alt="بزرگ‌نمایی">
    </div>

    <script>
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");
        let pendingFile = null;
        let lastSentMessageId = null;
        let titleGenerated = false;

        /* ⭐ NEW ـــ تابع‌های تایپینگ */
        function showTyping() {
            document.getElementById("typingIndicator").style.display = "block";
        }
        function hideTyping() {
            document.getElementById("typingIndicator").style.display = "none";
        }

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);

            // ⭐ NEW ـــ جواب اومد → تایپینگ مخفی میشه
            hideTyping();

            if (msg.type === "chats") loadChats(msg.data);

            if (msg.type === "chat" || msg.type === "chat_switched") {
                const box = document.getElementById("messages");
                box.innerHTML = "";
                if (msg.messages) {
                    msg.messages.forEach(m => addMessage(m.role, m.content, m.file));
                    box.scrollTop = box.scrollHeight;
                }
                titleGenerated = !!msg.smart_title;
            }

            if (msg.type === "new_message") {
                addMessage(msg.role || "bot", msg.content, msg.file);
            }
        };

        ws.onopen = () => send({action: "get_chats"});

        function send(data) {
            ws.send(JSON.stringify(data));
        }

        function loadChats(chats) {
            const list = document.getElementById("chatList");
            list.innerHTML = "";
            chats.forEach((c, i) => {
                const btn = document.createElement("button");
                btn.className = "chat-btn";
                btn.textContent = c.smart_title || c.title || "چت جدید";
                btn.onclick = () => {
                    titleGenerated = !!c.smart_title;
                    send({action: "switch_chat", index: i});
                };
                list.appendChild(btn);
            });
        }

        function addMessage(role, content, file = null) {
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            let html = `<strong>${role === 'user' ? 'شما' : 'مربی'}:</strong> `;
            if (file && file.mimeType && file.mimeType.startsWith('image/')) {
                const src = file.tempUrl || `/uploads/${file.filename}`;
                html += `<img src="${src}" loading="lazy">`;
            }
            html += (content || "").replace(/\n/g, '<br>');
            div.innerHTML = html;
            document.getElementById("messages").appendChild(div);
            div.scrollIntoView({behavior: "smooth"});
        }

        document.getElementById("messages").addEventListener("click", e => {
            if (e.target.tagName === "IMG") {
                document.getElementById("modalImage").src = e.target.src;
                document.getElementById("imageModal").classList.add("active");
            }
        });

        function closeModal() {
            document.getElementById("imageModal").classList.remove("active");
        }

        document.getElementById("fileInput").addEventListener("change", e => {
            const file = e.target.files[0];
            if (!file) return;
            pendingFile = file;
            showPreview(file);
        });

        function showPreview(file) {
            const preview = document.getElementById("filePreview");
            preview.innerHTML = "";
            const div = document.createElement("div");
            div.style.position = "relative";
            div.style.display = "inline-block";
            div.style.margin = "8px";
            const el = file.type.startsWith("image/") ? document.createElement("img") : document.createElement("video");
            const url = URL.createObjectURL(file);
            el.src = url;
            el.style.maxHeight = "180px";
            el.style.borderRadius = "12px";
            if (file.type.startsWith("video/")) el.controls = true;
            div.appendChild(el);
            pendingFile.tempUrl = url;

            const removeBtn = document.createElement("button");
            removeBtn.textContent = "×";
            removeBtn.className = "remove-preview";
            removeBtn.onclick = () => {
                URL.revokeObjectURL(url);
                preview.innerHTML = "";
                pendingFile = null;
                document.getElementById("fileInput").value = "";
            };
            div.appendChild(removeBtn);
            preview.appendChild(div);
        }

        async function sendMessage() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            const hasFile = !!pendingFile;
            const hasText = text.length > 0;
            if (!hasFile && !hasText) return;

            lastSentMessageId = Date.now() + Math.random();

            // ⭐ NEW ـــ در این لحظه تایپینگ نمایان شود
            showTyping();

            if (hasFile) {
                addMessage("user", text || "عکس ارسال شد", {
                    filename: pendingFile.name,
                    mimeType: pendingFile.type,
                    tempUrl: pendingFile.tempUrl
                });
            } else {
                addMessage("user", text);
            }

            if (hasFile) {
                const base64 = await fileToBase64(pendingFile);
                send({
                    action: "send_file",
                    filename: pendingFile.name,
                    mimeType: pendingFile.type,
                    data: base64.split(',')[1],
                    text: text
                });
                if (pendingFile.tempUrl) URL.revokeObjectURL(pendingFile.tempUrl);
                document.getElementById("filePreview").innerHTML = "";
                pendingFile = null;
                document.getElementById("fileInput").value = "";
            } else {
                send({ action: "send_message", text: text });
            }

            input.value = "";
            input.focus();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        document.getElementById("sendBtn").onclick = e => { e.preventDefault(); sendMessage(); };
        document.getElementById("msgInput").onkeydown = async e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                await sendMessage();
            }
        };
    </script>
</body>
</html>
