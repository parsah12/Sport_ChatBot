<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <title>مربی هوشمند بدنسازی</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- سایدبار کشویی -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>چت‌ها</h2>
              
            </div>
            <button onclick="send({action:'new_chat'})" class="btn">چت جدید</button>
            <button onclick="if(confirm('همه پاک بشن؟')) send({action:'clear_all'})" class="btn danger">پاک کردن همه</button>
            <hr>
            <div id="chatList" class="chat-list"></div>
        </div>

        <!-- دکمه باز کردن سایدبار -->
   

        <div class="chat-area">
            <div id="chatTitle" class="chat-title">مربی ورزش هوشمند</div>
            <div id="messages" class="messages"></div>

            <!-- تایپینگ زیر پیام‌ها -->
            <div id="typingIndicator">در حال پردازش پیام شما...</div>

            <div class="input-container">
                <div id="filePreview" class="file-preview"></div>
                <div class="input-box">
                    <label for="fileInput" class="attach-btn" title="آپلود عکس یا فیلم"><i class="fa-solid fa-paperclip"></i></label>
                    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
                    <textarea id="msgInput" placeholder="هدفت چیه؟ (چربی‌سوزی، عضله، فرم بدن...)" rows="1"></textarea>
                    <button id="sendBtn" class="send-btn">send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <span class="modal-close" onclick="closeModal()">×</span>
        <img id="modalImage" src="" alt="بزرگ‌نمایی">
    </div>

    <script>
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");
        let pendingFile = null;
        let titleGenerated = false;

        function showTyping() {
            document.getElementById("typingIndicator").style.display = "block";
        }
        function hideTyping() {
            document.getElementById("typingIndicator").style.display = "none";
        }

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            hideTyping();

            if (msg.type === "chats") loadChats(msg.data);

            if (msg.type === "chat" || msg.type === "chat_switched") {
                const box = document.getElementById("messages");
                box.innerHTML = "";
                if (msg.messages) {
                    msg.messages.forEach(m => addMessage(m.role, m.content, m.file));
                    box.scrollTop = box.scrollHeight;
                }
                titleGenerated = !!msg.smart_title;
            }

            if (msg.type === "new_message") {
                addMessage(msg.role || "bot", msg.content, msg.file);
            }
        };

        ws.onopen = () => send({action: "get_chats"});

        function send(data) {
            ws.send(JSON.stringify(data));
        }

        // تابع جدید: بارگذاری چت‌ها + کلیک راست برای حذف
        function loadChats(chats) {
            const list = document.getElementById("chatList");
            list.innerHTML = "";
            chats.forEach((c, i) => {
                const div = document.createElement("div");
                div.className = "chat-item";
                div.dataset.index = i;

                const btn = document.createElement("button");
                btn.className = "chat-btn";
                btn.textContent = c.smart_title || c.title || "چت جدید";

                // کلیک چپ: سوئیچ به چت
                btn.onclick = () => {
                    titleGenerated = !!c.smart_title;
                    send({action: "switch_chat", index: i});
                };

                // کلیک راست: منوی حذف
                div.oncontextmenu = (e) => {
                    e.preventDefault();
                    showContextMenu(e, i);
                };

                div.appendChild(btn);
                list.appendChild(div);
            });
        }

        // منوی کلیک راست
        function showContextMenu(e, index) {
            const oldMenu = document.getElementById("contextMenu");
            if (oldMenu) oldMenu.remove();

            const menu = document.createElement("div");
            menu.id = "contextMenu";
            menu.className = "context-menu";
            menu.style.top = `${e.clientY}px`;
            menu.style.left = `${e.clientX}px`;

            const deleteOption = document.createElement("button");
            deleteOption.textContent = "حذف این چت";
            deleteOption.onclick = () => {
                if (confirm("این چت حذف بشه؟")) {
                    send({action: "delete_chat", index: index});
                }
                menu.remove();
            };

            menu.appendChild(deleteOption);
            document.body.appendChild(menu);

            // بستن منو با کلیک بیرون
            const closeMenu = (ev) => {
                if (!menu.contains(ev.target)) {
                    menu.remove();
                    document.removeEventListener("click", closeMenu);
                }
            };
            setTimeout(() => document.addEventListener("click", closeMenu), 100);
        }

        function addMessage(role, content, file = null) {
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            let html = `<strong>${role === 'user' ? 'شما' : 'مربی'}:</strong> `;
            if (file && file.mimeType && file.mimeType.startsWith('image/')) {
                const src = file.tempUrl || `/uploads/${file.filename}`;
                html += `<img src="${src}" loading="lazy">`;
            }
            html += (content || "").replace(/\n/g, '<br>');
            div.innerHTML = html;
            document.getElementById("messages").appendChild(div);
            div.scrollIntoView({behavior: "smooth"});
        }

        // بقیه کدها بدون تغییر
        document.getElementById("messages").addEventListener("click", e => {
            if (e.target.tagName === "IMG") {
                document.getElementById("modalImage").src = e.target.src;
                document.getElementById("imageModal").classList.add("active");
            }
        });

        function closeModal() {
            document.getElementById("imageModal").classList.remove("active");
        }

        document.getElementById("fileInput").addEventListener("change", e => {
            const file = e.target.files[0];
            if (!file) return;
            pendingFile = file;
            showPreview(file);
        });

        function showPreview(file) {
            const preview = document.getElementById("filePreview");
            preview.innerHTML = "";
            const div = document.createElement("div");
            div.style.position = "relative";
            div.style.display = "inline-block";
            div.style.margin = "8px";
            const el = file.type.startsWith("image/") ? document.createElement("img") : document.createElement("video");
            const url = URL.createObjectURL(file);
            el.src = url;
            el.style.maxHeight = "180px";
            el.style.borderRadius = "12px";
            if (file.type.startsWith("video/")) el.controls = true;
            div.appendChild(el);
            pendingFile.tempUrl = url;

            const removeBtn = document.createElement("button");
            removeBtn.textContent = "×";
            removeBtn.className = "remove-preview";
            removeBtn.onclick = () => {
                URL.revokeObjectURL(url);
                preview.innerHTML = "";
                pendingFile = null;
                document.getElementById("fileInput").value = "";
            };
            div.appendChild(removeBtn);
            preview.appendChild(div);
        }

        async function sendMessage() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            const hasFile = !!pendingFile;
            const hasText = text.length > 0;
            if (!hasFile && !hasText) return;

            showTyping();

            if (hasFile) {
                addMessage("user", text || "عکس ارسال شد", {
                    filename: pendingFile.name,
                    mimeType: pendingFile.type,
                    tempUrl: pendingFile.tempUrl
                });
            } else {
                addMessage("user", text);
            }

            if (hasFile) {
                const base64 = await fileToBase64(pendingFile);
                send({
                    action: "send_file",
                    filename: pendingFile.name,
                    mimeType: pendingFile.type,
                    data: base64.split(',')[1],
                    text: text
                });
                if (pendingFile.tempUrl) URL.revokeObjectURL(pendingFile.tempUrl);
                document.getElementById("filePreview").innerHTML = "";
                pendingFile = null;
                document.getElementById("fileInput").value = "";
            } else {
                send({ action: "send_message", text: text });
            }

            input.value = "";
            input.focus();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        document.getElementById("sendBtn").onclick = e => { e.preventDefault(); sendMessage(); };
        document.getElementById("msgInput").onkeydown = async e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                await sendMessage();
            }
        };

        // سایدبار کشویی
        const sidebar = document.getElementById("sidebar");
        const toggleBtn = document.getElementById("toggleSidebar");
        const openBtn = document.getElementById("openSidebarBtn");

        toggleBtn.onclick = () => {
            sidebar.classList.toggle("closed");
            openBtn.classList.toggle("active");
        };

        openBtn.onclick = () => {
            sidebar.classList.remove("closed");
            openBtn.classList.remove("active");
        };

        document.getElementById("messages").addEventListener("click", () => {
            if (window.innerWidth <= 768 && !sidebar.classList.contains("closed")) {
                sidebar.classList.add("closed");
                openBtn.classList.add("active");
            }
        });
    </script>
</body>
</html>
