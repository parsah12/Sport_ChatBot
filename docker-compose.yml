version: "3.9"

services:
  chat_saver:
    build: .
    container_name: chat_saver_app
    image: chat-saver:latest
    restart: always
    volumes:
      - ./db:/app/db        # ذخیره دائمی دیتابیس SQLite
      - ./chats:/app/chats  # پوشه چت‌ها (اختیاری)
    working_dir: /app
    command: ["python", "app.py"]
    networks:
      - chat_network

networks:
  chat_network:
    name: chat_network
    driver: bridge
